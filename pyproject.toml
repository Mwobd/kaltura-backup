[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaltura-backup"
version = "0.1.0"
description = "Backup utility for Kaltura content"
requires-python = ">=3.11"

[project.scripts]
kaltura-backup = "kaltura_backup.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
